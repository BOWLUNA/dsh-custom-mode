# 每次 push / PR 都对着**真实的出厂 preset** 跑一遍编译器测试。
#
# 为什么 CI 里要装一遍 dsh：`composition.mjs` 做的是对官方 preset 文本的手术，
# 出厂文本本身不在本仓库里。装了 dsh 才能拿到那份文本，测出来的才是真结论 ——
# 否则 CI 只能跑一个自己构造的假 fixture，等于什么都没测。
#
# 版本与 `editor/package.json` 的 version 保持一致；升 dsh 时这里也要改。
name: test

# 最小权限：这个 workflow 只读代码、跑测试，不需要写任何东西。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 是保守下限（只用标准库），24 是当前开发版本。
        node-version: ['20', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # 只为了拿它自带的 @deepseek-ai/dsh-agent-presets/presets。
      # --no-save：仓库不因为 CI 多出一个 lockfile / package.json。
      - name: 安装 DSH（只为取出厂 preset）
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@0.1.6-alpha.1

      - name: 语法检查
        run: |
          for f in editor/*.mjs editor/client.js preset/*.mjs test/*.mjs; do
            node --check "$f"
          done

      # 两个套件：组成文件编译器 63 项 + 词典 65 项。
      # run.mjs 自己解析出厂 preset 目录，解析不到会以退出码 2 明确报错。
      - name: 测试
        run: node test/run.mjs

      - name: install.sh 自身可解析（bash -n）
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      # 发布包最容易踩的坑不是"多打了文件"，而是**少打了**：dsh.bundle.patch 指向的补丁、
      # 或浏览器半的 client.js 一旦被 files 白名单漏掉，npm 上的包装了也没用，
      # 而且要等到有人装完才发现。这里对着真实的 packlist 断言。
      - name: npm 打包自检（发布包里不能少文件）
        working-directory: editor
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const fs = require("fs");
            const files = JSON.parse(fs.readFileSync("/tmp/pack.json", "utf8"))[0].files.map((f) => f.path);
            const need = ["index.mjs", "client.js", "composition.mjs", "meta.mjs", "paths.mjs", "cordis.patch.yml", "package.json"];
            const missing = need.filter((name) => !files.includes(name));
            const stray = files.filter((path) => /^(test|tools|docs)\//.test(path));
            console.log("打包内容:", files.join(", "));
            if (missing.length > 0) {
              console.error("打包缺文件:", JSON.stringify(missing));
              process.exit(1);
            }
            if (stray.length > 0) {
              console.error("打包混入了非运行时文件:", JSON.stringify(stray));
              process.exit(1);
            }
          '
