# 每次 push / PR 都对着**真实的出厂 preset** 跑一遍编译器测试。
#
# 为什么 CI 里要装一遍 dsh：`composition.mjs` 做的是对官方 preset 文本的手术，
# 出厂文本本身不在本仓库里。装了 dsh 才能拿到那份文本，测出来的才是真结论 ——
# 否则 CI 只能跑一个自己构造的假 fixture，等于什么都没测。
#
# 版本与 `editor/package.json` 的 version 保持一致；升 dsh 时这里也要改。
name: test

# 最小权限：这个 workflow 只读代码、跑测试，不需要写任何东西。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 20 是保守下限（只用标准库），24 是当前开发版本。
        node-version: ['20', '24']
        # 只测开发主线（预览线）；稳定线与上一条预览线单独列在 include 里。
        dsh: ['0.1.7-rc.1']
        include:
          # Windows 是最容易出差异的平台，而它长期没进过 CI：一次外部 Windows 实测因此
          # 发现了三处只在 Windows 显现的缺陷（install.sh 的 MSYS 路径、并发 rename 的
          # EPERM、平台表达式行的求值方向导致 4 条断言假失败）。只在 node 24 上跑，控时长。
          - os: windows-latest
            node-version: '24'
            dsh: '0.1.7-rc.1'
          # 稳定线 = npm `latest`（也就是插件市场里"点一下安装"的大多数用户）。
          # 0.1.5-rc.3 是当前 latest；实测：安装、组合树、围栏、state/history/warnings 全过。
          - os: ubuntu-latest
            node-version: '24'
            dsh: '0.1.5-rc.3'
          # 上一条预览线。0.1.6-alpha.2 是 preset 机制切换前的**最后一版**（复数包到此为止），
          # 而它仍在生产上跑（开发机的实际环境就是它），所以保留一腿。
          - os: ubuntu-latest
            node-version: '24'
            dsh: '0.1.6-alpha.2'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # 装 DSH 本身，并准备**测试夹具**用的出厂 preset 目录。
      #
      #  1) `--no-save`：仓库不因为 CI 多出一个 lockfile / package.json。
      #  2) 测试需要一份出厂 preset 目录作为夹具（`test/run.mjs` 会按模式名校验它），
      #     历史上它来自 `@deepseek-ai/dsh-agent-presets/presets`。而 **0.1.7 起那个包已不存在**
      #     （preset 机制换成了声明式注册表），所以那条线显式装一份旧包 —— **只当夹具**。
      #     **运行时不再依赖它**：插件在 0.1.7 上改从 `agentPresets.compositionInventory()` 取行。
      #
      #  ★ 夹具包必须装在**仓库根**的 node_modules，不能放临时目录：
      #    `editor/composition.mjs` 的 `unresolvableRows()` 是从 presets 目录**往上推三层**找
      #    `node_modules/@deepseek-ai` 的。夹具放别处会让那个根只剩夹具包本身，于是**每一行都被
      #    报成"本机装不了"**，`test/seed.test.mjs` 的那条断言随之假失败（本地实测踩到过）。
      - name: 安装 DSH（并准备测试夹具的 presets 目录）
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
          FIXTURE="node_modules/@deepseek-ai/dsh-agent-presets/presets"
          if [ ! -d "$FIXTURE" ]; then
            echo "本线不含 $FIXTURE —— 装一份旧包仅作测试夹具（运行时不用它）"
            npm install --no-save --no-audit --no-fund @deepseek-ai/dsh-agent-presets@0.1.6-alpha.2
          fi
          # 断言夹具的"上三层"确实落在一个含 @deepseek-ai 的 node_modules 里 —— 否则上面的坑会静默重演。
          ROOT="$(cd "$(dirname "$(dirname "$(dirname "$FIXTURE")")")" && pwd)"
          test -d "$ROOT/@deepseek-ai" || { echo "夹具根 $ROOT 下没有 @deepseek-ai，unresolvableRows 会误报全局"; exit 1; }
          echo "夹具根 = $ROOT"
          # 后面所有 step 都用它（test/run.mjs 的第一解析顺位）。
          echo "DSH_SHIPPED_PRESETS_DIR=$PWD/$FIXTURE" >> "$GITHUB_ENV"
          ls "$FIXTURE"

      - name: 语法检查
        shell: bash
        run: |
          for f in editor/*.mjs editor/client.js preset/*.mjs test/*.mjs; do
            node --check "$f"
          done

      # 两个套件：组成文件编译器 63 项 + 词典 65 项。
      # run.mjs 自己解析出厂 preset 目录，解析不到会以退出码 2 明确报错。
      - name: 测试
        run: node test/run.mjs

      # Git Bash 也在 Windows 上跑这一段：脚本里任何"绝对路径进 node -e"的写法会在这里
      # 以外的方式暴露（真正抓住它的是 test/meta.test.mjs 的静态守卫）。
      - name: install.sh 自身可解析（bash -n）
        shell: bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      # 包版本必须等于 CI 钉住并测试的 dsh 版本（允许 .revN 修订后缀）。
      # 只改一处会让 CI 在旧运行时上通过，而发布的包声称适配了没测过的版本。
      # 每个矩阵项都断言：**它自己装的那条 dsh 线**落在声明的兼容范围内。
      - name: 版本一致性
        run: node tools/verify-version-consistency.mjs --dsh ${{ matrix.dsh }}

      # README.md / README.zh.md（以及 CONTRIBUTING 那一对）权威相同：
      # 改了一侧忘了另一侧，这里直接失败，而不是等有人切语言才发现。
      - name: 双语配对一致性
        run: node tools/verify-translation-pairing.mjs

      # 文档里的数字也是声明，所以也当检查跑：套件数/检查数/dsh 范围/支持表里的版本，
      # 全部与实际运行结果对齐（外部审阅一次就找出三处漂移，而测试看不到文档）。
      - name: 文档数字与实际一致
        run: node tools/verify-doc-numbers.mjs

      # 发布包最容易踩的坑不是"多打了文件"，而是**少打了**：dsh.bundle.patch 指向的补丁、
      # 或浏览器半的 client.js 一旦被 files 白名单漏掉，npm 上的包装了也没用，
      # 而且要等到有人装完才发现。这里对着真实的 packlist 断言。
      - name: npm 打包自检（发布包里不能少文件）
        working-directory: editor
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("fs");
            const files = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].files.map((f) => f.path);
            const need = ["index.mjs", "client.js", "composition.mjs", "meta.mjs", "paths.mjs", "cordis.patch.yml", "package.json"];
            const missing = need.filter((name) => !files.includes(name));
            const stray = files.filter((path) => /^(test|tools|docs)\//.test(path));
            console.log("打包内容:", files.join(", "));
            if (missing.length > 0) {
              console.error("打包缺文件:", JSON.stringify(missing));
              process.exit(1);
            }
            if (stray.length > 0) {
              console.error("打包混入了非运行时文件:", JSON.stringify(stray));
              process.exit(1);
            }
          ' "$RUNNER_TEMP/pack.json"
