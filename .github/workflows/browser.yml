# Both current channels must load the packed plugin and pass rendered/lifecycle checks.
name: browser
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-alpha.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact host in an independent directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/host"
          printf '{"private":true,"name":"custom-mode-ci-host","version":"1.0.0"}\n' > "$RUNNER_TEMP/host/package.json"
          npm install --prefix "$RUNNER_TEMP/host" --no-audit --no-fund --save-exact "@deepseek-ai/dsh@${{ matrix.dsh }}" pnpm@12
          echo "$RUNNER_TEMP/host/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Packed install, unit and boot checks
        run: node tools/compat-check.mjs --host-install "$RUNNER_TEMP/host" --out "$RUNNER_TEMP/evidence" --port 32110
      - name: API, five base modes, browser, uninstall and reinstall
        shell: bash
        run: |
          BROWSER=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$BROWSER"
          node tools/runtime-check.mjs --host-install "$RUNNER_TEMP/host" --out "$RUNNER_TEMP/evidence" --browser "$BROWSER" --port 32110 --cdp-port 9229
      - name: Keep sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.dsh }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.log
            ${{ runner.temp }}/evidence/*.png
            ${{ runner.temp }}/evidence/*.txt
          retention-days: 14
          if-no-files-found: ignore
