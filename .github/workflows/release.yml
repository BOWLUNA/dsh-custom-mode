# 打 tag 即发布 —— 这条链路存在的理由：会话内的 npm token 会失效/过期，而 npm 现在走"分阶段发布"，
# 需要 2FA 批准。用仓库 secret 里的 automation token（或改用 npm trusted publishing / OIDC）就不必每次都人工过一遍。
#
# 一次性准备（推荐，无需任何 token）：在 npm 的 package 设置里建立 Trusted Publisher 连接 ——
#   Publisher: GitHub Actions / Organization: BOWLUNA / Repository: dsh-custom-mode
#   Workflow filename: release.yml        ← 必须与这个文件名一致
#   Allowed actions: 勾选 "Allow npm publish" 则 tag 推上去即发布；不勾则每次发布在 npm 页面点一次 Approve
# 备选：仓库 secret NPM_TOKEN（npm Automation token），未配置 OIDC 时它会生效。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # ★ contents 必须是 write：除了发 npm，这一步还要**创建 GitHub Release**。
  #   原先这里是 read，于是 tag 推上去之后仓库的 Releases 面板从不动 ——
  #   代码明明更新了，看首页却像"什么都没发生"（2026-09-21 实测踩到过这个误判）。
  contents: write
  # Trusted Publishing (OIDC) 要求这个权限：npm 用 GitHub 的 OIDC 令牌确认"这次发布确实来自本仓库的这个工作流"，
  # 因此**不需要任何 npm token**（也就不再有 token 失效、绕过 2FA 被限制这些问题）。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 与 test.yml 相同的守卫：发布前必须全绿，否则一个坏版本就上了 npm。
      # 发布闸门也要能测**新版那条线**：0.1.7 起出厂 presets 由声明式注册表提供，夹具由
      # test/run.mjs 从已安装主机的 dsh-web-app 声明派生（与产品同一条代码路径）。
      # 从前这里只装 0.1.6-alpha.2，于是"闸门全绿"和"CI 上 0.1.7 三条腿全红"可以同时成立
      # —— 1.9.10 … 1.9.12 三个版本就是这么发出去的，而设置页在那条线上整体不可用。
      - name: 安装 DSH 0.1.7-rc.2（当前主轴；夹具由其声明派生）
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@0.1.7-rc.2

      # ★ 不要在这里单独装 0.1.6 的 presets 夹具包。实测（2026-09-25，本仓库第一次推 v1.9.13）：
      #   在 0.1.7 的 peer 树上跑 npm i @deepseek-ai/dsh-agent-presets@0.1.6-alpha.2 会 **ERESOLVE
      #   失败**，而 GitHub 的 bash -e 直接判这一步失败 —— 闸门红了，宁可不发布。同一类错误此前让
      #   test.yml 的三条 0.1.7 腿红了三个版本（见 1.9.13 的 CHANGELOG），所以两边都改成「不装旧包」。
      - name: 套件（当前主轴）
        run: node test/run.mjs

      # 旧线（≤0.1.6）也要在**发布前**过一遍：那条线的 preset 机制完全不同（扫目录 + 复数包），
      # 而本包声明支持它。换装 0.1.6-alpha.2 会连带把 @deepseek-ai/dsh-agent-presets 装到仓库根
      # （实测），于是 test/run.mjs 走它的第一解析顺位，测到的是真实的旧线形态。
      - name: 换装 0.1.6-alpha.2，旧线再跑一遍
        run: |
          npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@0.1.6-alpha.2
          ls -d node_modules/@deepseek-ai/dsh-agent-presets/presets
          node test/run.mjs
      - name: 双语配对 + 语言纯度
        run: node tools/verify-translation-pairing.mjs
      - name: 文档数字
        run: node tools/verify-doc-numbers.mjs
      - name: 版本一致性（稳定线与预览线都必须在声明范围内）
        run: |
          node tools/verify-version-consistency.mjs --dsh 0.1.7-rc.2
          node tools/verify-version-consistency.mjs --dsh 0.1.6-alpha.2
          node tools/verify-version-consistency.mjs --dsh 0.1.5-rc.3

      # 凭据自检：改过 npm 密码、或怀疑 token 失效时，用 workflow_dispatch 手动跑一次这条工作流，
      # 这一步会直接告诉你 NPM_TOKEN 还能不能用（而不是等到下次发版才发现）。
      - name: 凭据自检（NPM_TOKEN 是否仍有效）
        working-directory: editor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "没有配置 NPM_TOKEN —— 发布将走 OIDC（Trusted Publishing）"
            exit 0
          fi
          echo "NPM_TOKEN 存在，验证身份："
          npm whoami

      - name: 发布（已存在的版本直接跳过）
        working-directory: editor
        # 混合认证：若配置了仓库 secret NPM_TOKEN（granular token，可勾 Bypass 2FA），就用它；
        # 没配置时该 env 为空，npm 会回退到 OIDC（Trusted Publishing）。两条路都不需要交互式 2FA。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-custom-mode@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-custom-mode@${VERSION} 已经在 npm 上 —— 什么都不做"
            exit 0
          fi
          npm publish --tag latest

      # ★ 建 GitHub Release。原先这条工作流只发 npm，所以仓库的 Releases 面板一直停在旧版本，
      #   而 README / 代码其实早就更新了 —— 一个纯粹"看不见"的缺口。
      #   正文直接从 CHANGELOG 抠出本 tag 那一节，不另写一份会漂移的文案。
      - name: 建 GitHub Release（正文取自 CHANGELOG）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          node -e '
            const fs = require("fs");
            const [ver, file, out] = process.argv.slice(1);
            const text = fs.readFileSync(file, "utf8");
            const start = text.indexOf("## [" + ver + "]");
            if (start === -1) { console.error("CHANGELOG 里找不到 " + ver); process.exit(1); }
            const rest = text.slice(start + 1);
            const next = rest.indexOf("\n## [");
            fs.writeFileSync(out, (next === -1 ? rest : rest.slice(0, next)).trimEnd() + "\n");
          ' "$VER" CHANGELOG.md /tmp/release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
