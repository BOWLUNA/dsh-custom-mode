# 打 tag 即发布 —— 这条链路存在的理由：会话内的 npm token 会失效/过期，而 npm 现在走"分阶段发布"，
# 需要 2FA 批准。用仓库 secret 里的 automation token（或改用 npm trusted publishing / OIDC）就不必每次都人工过一遍。
#
# 一次性准备（推荐，无需任何 token）：在 npm 的 package 设置里建立 Trusted Publisher 连接 ——
#   Publisher: GitHub Actions / Organization: BOWLUNA / Repository: dsh-custom-mode
#   Workflow filename: release.yml        ← 必须与这个文件名一致
#   Allowed actions: 勾选 "Allow npm publish" 则 tag 推上去即发布；不勾则每次发布在 npm 页面点一次 Approve
# 备选：仓库 secret NPM_TOKEN（npm Automation token），未配置 OIDC 时它会生效。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # ★ contents 必须是 write：除了发 npm，这一步还要**创建 GitHub Release**。
  #   原先这里是 read，于是 tag 推上去之后仓库的 Releases 面板从不动 ——
  #   代码明明更新了，看首页却像"什么都没发生"（2026-09-21 实测踩到过这个误判）。
  contents: write
  # Trusted Publishing (OIDC) 要求这个权限：npm 用 GitHub 的 OIDC 令牌确认"这次发布确实来自本仓库的这个工作流"，
  # 因此**不需要任何 npm token**（也就不再有 token 失效、绕过 2FA 被限制这些问题）。
  id-token: write

jobs:
  compatibility:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  browser:
    uses: ./.github/workflows/browser.yml
    permissions:
      contents: read
  publish:
    needs: [compatibility, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 凭据自检：改过 npm 密码、或怀疑 token 失效时，用 workflow_dispatch 手动跑一次这条工作流，
      # 这一步会直接告诉你 NPM_TOKEN 还能不能用（而不是等到下次发版才发现）。
      - name: 凭据自检（NPM_TOKEN 是否仍有效）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "没有配置 NPM_TOKEN —— 发布将走 OIDC（Trusted Publishing）"
            exit 0
          fi
          echo "NPM_TOKEN 存在，验证身份："
          npm whoami

      - name: 发布（已存在的版本直接跳过）
        # 手动 dispatch 只做凭据自检，不从 main 把未打 tag 的版本发上 npm。
        if: startsWith(github.ref, 'refs/tags/v')
        # 混合认证：若配置了仓库 secret NPM_TOKEN（granular token，可勾 Bypass 2FA），就用它；
        # 没配置时该 env 为空，npm 会回退到 OIDC（Trusted Publishing）。两条路都不需要交互式 2FA。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # tee must not turn a failed npm publish into a successful release.
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json ${VERSION} 不一致"
            exit 1
          fi
          if npm view "dsh-custom-mode@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-custom-mode@${VERSION} 已经在 npm 上 —— 什么都不做"
            exit 0
          fi
          # ★ 竞态兜底（实测踩过，v1.9.16）：上面那次 npm view 读的是**注册表缓存**，而本地刚
          #   publish 的版本要 1–3 分钟才可见。于是这条闸门会在"本地已发、注册表还没醒"的窗口里
          #   判定"尚不存在"，然后 publish —— 拿到 EPUBLISHCONFLICT
          #   （`cannot publish over the previously published versions`）并让整步失败，
          #   **连带把后面的 GitHub Release 一起跳过**。
          #   那个报错的语义是"目标状态已经达成"，所以它不是失败：把它当成功，其余照旧失败。
          if npm publish --tag latest 2>&1 | tee /tmp/publish.log; then
            exit 0
          fi
          if grep -q "previously published versions" /tmp/publish.log; then
            echo "::notice::dsh-custom-mode@${VERSION} 已被发布（竞态），视为成功。"
            exit 0
          fi
          echo "::error::发布失败，日志见上。"
          exit 1

      # ★ 桌面端可直接导入的 .dshpreset（zip：manifest.json + preset/ 五个文件）。
      #   PUBLISHING 一直写着每个 Release 都带一个，但此前这条工作流并不产出它 ——
      #   于是 Releases 面板只有源码包，桌面端用户得自己 clone 再导入。
      #   sourceDshVersion 是**本次适配的 dsh 版本**（不是插件版本），与 test.yml 的 matrix、
      #   engines.dsh 的钉子同源；换 dsh 线时一起改（见 AGENTS.md 第 10 条）。
      - name: 打包 .dshpreset（桌面端可直接导入）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'ZIP'
          import json, zipfile, datetime, os
          FILES = ['agent.cordis.yml', 'preset.yml', 'prompt.md', 'prompt-reader.mjs', 'prompt-tool.mjs']
          manifest = {
              'format': 'dsh-preset',
              'version': 1,
          'id': 'custom',
          # ★ 名字与描述都**只用一种语言**，描述留空 —— 与 preset/preset.yml 同一条理由：
          #   这是**产品数据**，壳按界面语言渲染自己的出厂预设，但没法本地化我们的。写一种语言，
          #   另一种界面里就是外语；两种都写（原来是 `自定义模式 / Custom mode`），就是被点名的
          #   "中英拼接"。导入之后用户可以自己填描述。
          'name': '自定义模式',
          'description': '',
              'sourceDshVersion': '0.2.0-rc.2',
              'exportedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z'),
          }
          with zipfile.ZipFile('dsh-custom-mode.dshpreset', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('manifest.json', json.dumps(manifest, ensure_ascii=False, indent=2))
              for name in FILES:
                  z.write(os.path.join('preset', name), 'preset/' + name)
          ZIP
          unzip -l dsh-custom-mode.dshpreset

      # ★ 建 GitHub Release。原先这条工作流只发 npm，所以仓库的 Releases 面板一直停在旧版本，
      #   而 README / 代码其实早就更新了 —— 一个纯粹"看不见"的缺口。
      #   正文直接从 CHANGELOG 抠出本 tag 那一节，不另写一份会漂移的文案。
      - name: 建 GitHub Release（正文取自 CHANGELOG）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          node -e '
            const fs = require("fs");
            const [ver, file, out] = process.argv.slice(1);
            const text = fs.readFileSync(file, "utf8");
            const start = text.indexOf("## [" + ver + "]");
            if (start === -1) { console.error("CHANGELOG 里找不到 " + ver); process.exit(1); }
            const rest = text.slice(start + 1);
            const next = rest.indexOf("\n## [");
            fs.writeFileSync(out, (next === -1 ? rest : rest.slice(0, next)).trimEnd() + "\n");
          ' "$VER" CHANGELOG.md /tmp/release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md dsh-custom-mode.dshpreset
