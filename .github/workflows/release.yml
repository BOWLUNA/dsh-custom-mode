# 打 tag 即发布 —— 这条链路存在的理由：会话内的 npm token 会失效/过期，而 npm 现在走"分阶段发布"，
# 需要 2FA 批准。用仓库 secret 里的 automation token（或改用 npm trusted publishing / OIDC）就不必每次都人工过一遍。
#
# 一次性准备（推荐，无需任何 token）：在 npm 的 package 设置里建立 Trusted Publisher 连接 ——
#   Publisher: GitHub Actions / Organization: BOWLUNA / Repository: dsh-custom-mode
#   Workflow filename: release.yml        ← 必须与这个文件名一致
#   Allowed actions: 勾选 "Allow npm publish" 则 tag 推上去即发布；不勾则每次发布在 npm 页面点一次 Approve
# 备选：仓库 secret NPM_TOKEN（npm Automation token），未配置 OIDC 时它会生效。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_version:
        description: 'Exact package version to publish from main; blank checks identity only'
        required: false
        default: ''
        type: string

permissions:
  # ★ contents 必须是 write：除了发 npm，这一步还要**创建 GitHub Release**。
  #   原先这里是 read，于是 tag 推上去之后仓库的 Releases 面板从不动 ——
  #   代码明明更新了，看首页却像"什么都没发生"（2026-09-21 实测踩到过这个误判）。
  contents: write
  # Trusted Publishing (OIDC) 要求这个权限：npm 用 GitHub 的 OIDC 令牌确认"这次发布确实来自本仓库的这个工作流"，
  # 因此**不需要任何 npm token**（也就不再有 token 失效、绕过 2FA 被限制这些问题）。
  id-token: write

jobs:
  compatibility:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  browser:
    uses: ./.github/workflows/browser.yml
    permissions:
      contents: read
  publish:
    needs: [compatibility, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Blank dispatch checks identity; an explicit matching version publishes only from main.
      # 这一步会直接告诉你 NPM_TOKEN 还能不能用（而不是等到下次发版才发现）。
      - name: 凭据自检（NPM_TOKEN 是否仍有效）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "没有配置 NPM_TOKEN —— 发布将走 OIDC（Trusted Publishing）"
            exit 0
          fi
          echo "NPM_TOKEN 存在，验证身份："
          npm whoami

      - name: Validate release target and prepare its tag
        id: release_target
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_version != '')
        env:
          REQUESTED_VERSION: ${{ inputs.publish_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE="$(node -p "require('./package.json').name")"
          test "$PACKAGE" = 'dsh-custom-mode'
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ -n "$REQUESTED_VERSION" ]; then
            if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ "$REQUESTED_VERSION" != "$VERSION" ]; then
              echo '::error::Manual publication requires main and the exact package version'
              exit 1
            fi
            TAG="v${VERSION}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              TARGET="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
              if [ "$TARGET" != "$GITHUB_SHA" ]; then
                echo '::error::Existing release tag points to a different commit; no overwrite allowed'
                exit 1
              fi
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
            fi
          else
            TAG="$GITHUB_REF_NAME"
            test "$TAG" = "v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build fixed plugin archive, preset import archive, and checksums
        if: steps.release_target.outputs.tag != ''
        run: |
          node tools/release-package-selftest.mjs
          python3 tools/release-assets.py dist

      - name: Publish or verify the exact already-published package
        # Blank dispatch checks identity; an explicit matching version publishes only from main.
        if: steps.release_target.outputs.tag != ''
        # 混合认证：若配置了仓库 secret NPM_TOKEN（granular token，可勾 Bypass 2FA），就用它；
        # 没配置时该 env 为空，npm 会回退到 OIDC（Trusted Publishing）。两条路都不需要交互式 2FA。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ steps.release_target.outputs.tag }}
        run: |
          # Only a public 404 permits publication. Authentication/network failures never mean absent.
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="dist/dsh-custom-mode-${VERSION}.tgz"
          if [ "${RELEASE_TAG}" != "v${VERSION}" ]; then
            echo "::error::tag ${RELEASE_TAG} 与 package.json ${VERSION} 不一致"
            exit 1
          fi
          if node tools/verify-published-package.mjs --archive "$ARCHIVE" --commit "$GITHUB_SHA"; then
            echo "Exact published gitHead and tarball bytes verified; publication is already complete."
            exit 0
          else
            STATUS=$?
            if [ "$STATUS" -ne 3 ]; then
              echo '::error::Could not establish an absent or identical published version; no publication attempted'
              exit "$STATUS"
            fi
          fi
          # Keep directory publication so npm records the checked-out commit as gitHead.
          # --ignore-scripts matches the fixed archive build and prevents a publish hook changing it.
          if npm publish --ignore-scripts --tag latest 2>&1 | tee /tmp/publish.log; then
            node tools/verify-published-package.mjs --archive "$ARCHIVE" --commit "$GITHUB_SHA" --attempts 12
            exit 0
          fi
          if grep -q "previously published versions" /tmp/publish.log; then
            # A conflict can be a successful concurrent publication only after identical identity/bytes.
            node tools/verify-published-package.mjs --archive "$ARCHIVE" --commit "$GITHUB_SHA" --attempts 12
            exit 0
          fi
          echo "::error::发布失败，日志见上。"
          exit 1

      # ★ 建 GitHub Release。原先这条工作流只发 npm，所以仓库的 Releases 面板一直停在旧版本，
      #   而 README / 代码其实早就更新了 —— 一个纯粹"看不见"的缺口。
      #   正文直接从 CHANGELOG 抠出本 tag 那一节，不另写一份会漂移的文案。
      - name: 建 GitHub Release（正文取自 CHANGELOG）
        if: steps.release_target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_target.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          VER="${TAG#v}"
          node -e '
            const fs = require("fs");
            const [ver, file, out] = process.argv.slice(1);
            const text = fs.readFileSync(file, "utf8");
            const start = text.indexOf("## [" + ver + "]");
            if (start === -1) { console.error("CHANGELOG 里找不到 " + ver); process.exit(1); }
            const rest = text.slice(start + 1);
            const next = rest.indexOf("\n## [");
            fs.writeFileSync(out, (next === -1 ? rest : rest.slice(0, next)).trimEnd() + "\n");
          ' "$VER" CHANGELOG.md /tmp/release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file /tmp/release-notes.md dist/dsh-custom-mode-"$VER".tgz dist/dsh-custom-mode.dshpreset dist/SHA256SUMS
