name: 功能建议
description: 想要这个模式多点什么、少点什么
title: '[feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        这个插件深度依赖 DSH 的内部 API（README 里有一张「耦合点清单」），
        所以请顺带说明你的需求是否只靠**现有 API** 就能做 —— 这能省掉一轮可行性来回。

  - type: textarea
    id: need
    attributes:
      label: 你想要什么
      description: 用一两句话描述结果，不用先想实现。
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么现在做不到
      description: 你现在是怎么绕的？绕不过去的地方在哪？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你想过或试过的替代方案
    validations:
      required: false
