name: Bug 报告
description: 装上之后哪里不对（起不来、页面不出现、模式不见了、开了关不了……）
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        先花一分钟看 [`docs/TROUBLESHOOTING.md`](https://github.com/BOWLUNA/dsh-custom-mode/blob/main/docs/TROUBLESHOOTING.md)：
        那里记的都是**实测复现过**的失败，装完 dsh 起不来、页面不出现、模式从选择器消失、保存被拒等
        都已有现成答案和自救命令。

        本插件的失败模式大多**静默**（不报错、只是不生效），所以下面几项信息几乎决定了能不能定位问题。

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: '`dsh --version` 的输出'
      placeholder: 0.1.6-alpha.1
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 本插件版本 / commit
      description: '`editor/package.json` 的 version，或 `git rev-parse --short HEAD`'
      placeholder: 0.1.6-alpha.1 / 0f05a31
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: 用的是哪个 profile
      options:
        - web
        - tui
        - 其他（在「现象」里说明）
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 看到什么、期望什么。有报错原文就直接贴。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ./install.sh
        2. 重启 dsh
        3. 打开 设置 → 自定义模式
        4. …
    validations:
      required: true

  - type: textarea
    id: dump-config
    attributes:
      label: 组合树自检输出
      description: |
        这一条能区分「装上了但没生效」和「根本没装上」，也是判断基础 bundle 是否丢失的直接证据。
        正常应有**上百行**。
      render: shell
      value: |
        $ dsh --profile web --dump-config | wc -l
        $ dsh --profile web --dump-config | grep -n custom-mode
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 启动日志 / 浏览器 Console
      description: |
        宿主半的诊断都以 `custom-mode:` 开头；浏览器 Console 里的报错同样以它开头
        （这一页的失败策略是「宁可整页不出现，也绝不把页面搞崩」，所以它只会往 Console 说话）。
      render: shell
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Ubuntu 24.04 / WSL2 / macOS 15 / Windows 11
    validations:
      required: true
